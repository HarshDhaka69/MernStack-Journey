<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Filter Exercise</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            padding: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        #searchInput {
            width: 100%;
            max-width: 400px;
            display: block;
            margin: 0 auto 30px;
            padding: 10px;
            font-size: 16px;
        }

        #students {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .student-card {
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
            transition: 0.3s;
        }

        .student-card:hover {
            transform: translateY(-5px);
        }

        .student-card h3 {
            margin-bottom: 10px;
        }

        .student-card p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <h1>Student Records</h1>

    <input
        type="text"
        id="searchInput"
        placeholder="Search student by name..."
    >

    <div id="students"></div>

    <script src="script.js"></script>

</body>
</html>
